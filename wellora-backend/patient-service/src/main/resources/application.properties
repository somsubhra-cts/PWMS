spring.application.name=patient-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/patient_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Swagger UI available at /swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers,mappings
management.endpoint.health.show-details=always
management.endpoint.shutdown.enabled=true
management.endpoints.web.base-path=/actuator

info.app.name=patient-service
info.app.description=Manages patient profiles and medical history
info.app.version=1.0.0
info.app.java-version=21
info.app.port=8081

# ?? Circuit Breaker ??????????????????????????????????????????

# notification-service circuit breaker
resilience4j.circuitbreaker.instances.notificationService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.notificationService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.notificationService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.notificationService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.notificationService.automaticTransitionFromOpenToHalfOpenEnabled=true


# ?? Retry ????????????????????????????????????????????????????
# Retry 3 times before opening circuit
resilience4j.retry.instances.notificationService.maxAttempts=3
resilience4j.retry.instances.notificationService.waitDuration=1s


# ?? Expose circuit breaker in actuator health ????????????????
management.health.circuitbreakers.enabled=true