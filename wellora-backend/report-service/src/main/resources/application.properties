spring.application.name=report-service
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/report_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Swagger UI available at /swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers,mappings
management.endpoint.health.show-details=always
management.endpoint.shutdown.enabled=true
management.endpoints.web.base-path=/actuator

info.app.name=report-service
info.app.description=Generates wellness reports and PDF downloads
info.app.version=1.0.0
info.app.java-version=21
info.app.port=8085

# ?? Circuit Breaker ??????????????????????????????????????????

# notification-service circuit breaker
resilience4j.circuitbreaker.instances.notificationService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.notificationService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.notificationService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.notificationService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.notificationService.automaticTransitionFromOpenToHalfOpenEnabled=true

# wellnessplan-service circuit breaker (progress + report only)
resilience4j.circuitbreaker.instances.wellnessplanService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.wellnessplanService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.wellnessplanService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.wellnessplanService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.wellnessplanService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.wellnessplanService.automaticTransitionFromOpenToHalfOpenEnabled=true

# patient-service circuit breaker (report only)
resilience4j.circuitbreaker.instances.patientService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.patientService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.patientService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.patientService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.patientService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.patientService.automaticTransitionFromOpenToHalfOpenEnabled=true

# progress-service circuit breaker (report only)
resilience4j.circuitbreaker.instances.progressService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.progressService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.progressService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.progressService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.progressService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.progressService.automaticTransitionFromOpenToHalfOpenEnabled=true

# ?? Retry ????????????????????????????????????????????????????
# Retry 3 times before opening circuit
resilience4j.retry.instances.notificationService.maxAttempts=3
resilience4j.retry.instances.notificationService.waitDuration=1s

resilience4j.retry.instances.wellnessplanService.maxAttempts=3
resilience4j.retry.instances.wellnessplanService.waitDuration=1s

resilience4j.retry.instances.patientService.maxAttempts=3
resilience4j.retry.instances.patientService.waitDuration=1s

resilience4j.retry.instances.progressService.maxAttempts=3
resilience4j.retry.instances.progressService.waitDuration=1s

# ?? Expose circuit breaker in actuator health ????????????????
management.health.circuitbreakers.enabled=true

# Enable Feign + Resilience4j integration
spring.cloud.openfeign.circuitbreaker.enabled=true